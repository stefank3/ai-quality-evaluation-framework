# GitHub-triggered deterministic engineering gate. Installs locked tools, then runs the
# same offline validation as local development; reads source and writes runner artifacts.
# No provider secrets, live command or schedule; failure blocks a successful check.
name: Deterministic validation
on:
  push:
    branches: [main, milestone/1-evaluation-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
